<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="dashboard">

    <h1>Dashboard</h1>
    <p>Welcome, <span th:text="${account.username}"></span></p>

    <!-- ================= BALANCE ================= -->
    <h2>Check Balance</h2>
    <div>
        <p class="balancecheck">
            Balance: ₹ <span id="actualBalance" th:text="${account.balance}">0</span>
        </p>

        <button type="button" onclick="showBalance()">View Balance</button>

        <p id="balanceBox" style="display:none; font-weight:bold; margin-top:10px;">
            Available Balance: ₹ <span id="balValue"></span>
        </p>
    </div>

    <!-- ================= DEPOSIT ================= -->
    <h2>Deposit</h2>
    <div class="depositbox">
        <form id="depositForm" th:action="@{/deposit}" method="post">
            <input type="number" name="amount" placeholder="Amount" step="0.01" required>
            <button type="submit">Deposit</button>
        </form>
    </div>

    <!-- ================= WITHDRAW ================= -->
    <h2>Withdraw</h2>
    <form id="withdrawForm" th:action="@{/withdraw}" method="post">
        <input type="number" name="amount" placeholder="Amount" step="0.01" required>
        <button type="submit">Withdraw</button>
    </form>

    <!-- ================= TRANSFER ================= -->
    <h2>Transfer</h2>
    <form id="transferForm" th:action="@{/transfer}" method="post">
        <input type="text" name="toUsername" placeholder="Recipient Username" required>
        <input type="number" name="amount" placeholder="Amount" step="0.01" required>
        <button type="submit">Transfer</button>
    </form>

    <!-- ================= TRANSACTION ================= -->
    <h2>Transaction History</h2>
    <form th:action="@{/transaction}" method="get">
        <button type="submit">See All Transactions</button>
    </form>

    <p><a th:href="@{/logout}">Logout</a></p>

</div>

<!-- ================= JS ================= -->
<script>
    function showBalance() {
        const balance = document.getElementById("actualBalance").innerText;
        document.getElementById("balValue").innerText = balance;
        document.getElementById("balanceBox").style.display = "block";
    }
</script>

<script src="/js/script.js"></script>

</body>
</html>
